services:
  web:
    build:
      context: .
      args:
        # Référence du code upstream CnamSign (projet d'origine, nom conservé)
        CNAMSIGN_REF: ${CNAMSIGN_REF:-main}
        CNAMSIGN_CACHEBUST: ${CNAMSIGN_CACHEBUST:-0}
    image: cnamsignsign-web:latest
    container_name: cnamsignsign-web
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      SECRET_KEY_FILE: /run/secrets/secret_key
      SECRET_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      CNAMSIGN_PATH: /opt/cnamsign
      DATA_DIR: /data
      # Une ancienne base /data/cnamsign.db est renommée automatiquement au démarrage.
      DATABASE_URL: sqlite:////data/cnamsignsign.db
    secrets:
      - secret_key
      - encryption_key
    volumes:
      - cnamsignsign-data:/data
    ports:
      - "${HOST_PORT:-8000}:8000"
    shm_size: 512m
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cnamsignsign-data:
    # Migration depuis l'ancien nom : DATA_VOLUME_NAME=<ancien volume> dans .env (voir README).
    name: ${DATA_VOLUME_NAME:-cnamsignsign-data}

secrets:
  secret_key:
    file: ./secrets/secret_key
  encryption_key:
    file: ./secrets/encryption_key
